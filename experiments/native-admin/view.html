<!doctype html><html><head><meta charset="utf-8"><title>Native admin MCP App</title>
<style>html,body{background:#fff}body{margin:0;position:relative;width:100vw;min-height:240px;height:100vh;font:13px system-ui}#status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:max-content;margin:0;z-index:1;max-width:calc(100% - 32px)}#status:empty{display:none}.aif-connection-status{box-sizing:border-box;display:flex;align-items:center;flex-wrap:wrap;gap:12px;width:420px;max-width:100%;padding:12px 16px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#1e1e1e;line-height:1.5}.aif-connection-icon{display:flex;flex-shrink:0;color:#757575}.aif-connection-message{flex:1;min-width:120px}#status .components-button{flex-shrink:0}@media(max-width:420px){.aif-connection-status{gap:8px;padding:12px}}@media(pointer:coarse){.aif-connection-status .components-button{min-height:44px}}.aif-loading .components-spinner{display:block;margin:0}iframe{position:fixed;top:0;left:50%;transform:translateX(-50%);display:block;width:100%;max-width:1100px;height:720px;border:0;visibility:hidden}body.aif-ready{height:720px}body.aif-ready iframe{position:absolute;visibility:visible}</style>
</head><body><div id="status"></div><iframe id="wordpress" title="Original WordPress admin"></iframe><script type="module" src="./view.js"></script></body></html>
